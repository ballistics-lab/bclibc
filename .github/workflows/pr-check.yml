name: PR Check

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            build_type: Debug
          - os: ubuntu-latest
            arch: x86_64
            build_type: Release
          - os: macos-latest
            arch: arm64
            build_type: Debug
          - os: macos-latest
            arch: arm64
            build_type: Release
          - os: windows-latest
            arch: x86_64
            build_type: Debug
          - os: windows-latest
            arch: x86_64
            build_type: Release
    uses: ./.github/workflows/build-lib.yml
    with:
      os: ${{ matrix.os }}
      arch: ${{ matrix.arch }}
      build_type: ${{ matrix.build_type }}
      retention_days: 1

  tests:
    name: Tests (${{ matrix.build_type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Debug keeps assert() alive (the tests are assert-based); Release is what ships.
        build_type: [Debug, Release]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build and run the C++ tests
        run: |
          cmake -S . -B build/tests -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBCLIBC_BUILD_TESTS=ON
          cmake --build build/tests -j"$(nproc)"
          ctest --test-dir build/tests --output-on-failure

      - name: tiny_bclibc identity test (same results as bclibc)
        run: |
          cmake -S tiny_bclibc -B build/identity -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DTINY_BCLIBC_BUILD_IDENTITY_TEST=ON
          cmake --build build/identity -j"$(nproc)"
          build/identity/tests/test_identity

  no-exceptions:
    name: No exceptions or RTTI in the core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build with -fno-exceptions -fno-rtti and check the objects
        run: cmake/check_no_exceptions.sh

  pre-commit:
    name: Pre-commit Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run pre-commit check
        run: |
          chmod +x pre-commit-check.sh
          ./pre-commit-check.sh

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: build
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Arch | Build Type | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|------|------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Linux    | x86_64 | Debug   | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Linux    | x86_64 | Release | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| macOS    | arm64  | Debug   | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| macOS    | arm64  | Release | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Windows  | x86_64 | Debug   | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Windows  | x86_64 | Release | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Artifacts available for 24 hours. The bare wasm module is checked separately by the \"WASM (bare module)\" workflow." >> $GITHUB_STEP_SUMMARY
