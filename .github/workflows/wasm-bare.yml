name: WASM (bare module)

# The bare WebAssembly module (no Emscripten, imports nothing) built with each toolchain and checked against the native
# library through the same flat C ABI: tests/wasm_parity/parity.py. See "Bare WebAssembly build" in the README.

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "src/**"
      - "include/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "Makefile"
      - "tests/wasm_parity/**"
      - ".github/workflows/wasm-bare.yml"
  workflow_dispatch:

env:
  WASI_SDK_VERSION: "34"

jobs:
  wasm:
    name: ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # C++ exceptions: the module returns the same error codes as the native library.
          - toolchain: wasi-sdk
            target: wasm
            errors: codes
          # zig has no exception runtime: a throw is a trap.
          - toolchain: zig
            target: wasm-zig
            errors: trap

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # The module uses WebAssembly's final exception encoding (`try_table`): a Node that has it (25 is what was tried).
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "25"

      - name: Install ninja and the host (wasmhost with wasmtime)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          python -m pip install --pre wasmhost wasmtime

      - name: Build the native library
        run: |
          cmake -S . -B build/native -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native --target bclibc_ffi

      # --- wasi-sdk ---
      - name: Cache wasi-sdk
        if: matrix.toolchain == 'wasi-sdk'
        id: wasi-sdk
        uses: actions/cache@v6
        with:
          path: wasi-sdk
          key: wasi-sdk-${{ env.WASI_SDK_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Download wasi-sdk
        if: matrix.toolchain == 'wasi-sdk' && steps.wasi-sdk.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux.tar.gz" -o wasi-sdk.tar.gz
          mkdir wasi-sdk
          tar -xzf wasi-sdk.tar.gz -C wasi-sdk --strip-components=1
          rm wasi-sdk.tar.gz

      # --- zig ---
      - name: Install zig
        if: matrix.toolchain == 'zig'
        run: python -m pip install ziglang

      - name: Build the module
        run: |
          if [[ "${{ matrix.toolchain }}" == "wasi-sdk" ]]; then
            make wasm WASI_SDK_PATH="$PWD/wasi-sdk"
            echo "WASM=build/wasm/bclibc_wasm.wasm" >> "$GITHUB_ENV"
          else
            make wasm-zig
            echo "WASM=build/wasm-zig/bclibc_wasm.wasm" >> "$GITHUB_ENV"
          fi

      - name: Same results as the native library (wasmtime, Node)
        run: |
          python tests/wasm_parity/parity.py \
            --native build/native/libbclibc_ffi.so \
            --wasm "$WASM" \
            --backend wasmtime --backend node \
            --errors ${{ matrix.errors }}

      - name: Upload the module
        uses: actions/upload-artifact@v7
        with:
          name: bclibc-wasm-${{ matrix.toolchain }}
          path: ${{ env.WASM }}
          retention-days: 7
